<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Marknest Store Shot</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 520px at 22% 6%, #fbf8f0 0%, rgba(251,248,240,0) 72%),
      radial-gradient(1000px 640px at 88% 100%, #e5dcc6 0%, rgba(229,220,198,0) 70%),
      linear-gradient(135deg, #efe9da 0%, #e7dfcc 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* subtle paper grain */
  body::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.25;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.06'/></svg>");
  }
  .browser{
    position: relative;
    width: 1184px; height: 706px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 36px 90px rgba(58,49,33,.22), 0 8px 24px rgba(58,49,33,.10), 0 0 0 1px rgba(90,78,55,.10);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* ---- tab strip ---- */
  .tabstrip{
    height: 40px; flex: none;
    background: #e9e5db;
    display: flex; align-items: flex-end; gap: 8px;
    padding: 0 16px;
  }
  .lights{ display:flex; gap:8px; align-self:center; margin-right:14px; }
  .light{ width:12px; height:12px; border-radius:50%; }
  .light.r{background:#ff5f57} .light.y{background:#febc2e} .light.g{background:#28c840}
  .tab{
    height: 32px; width: 250px;
    background: #fffdf8;
    border-radius: 9px 9px 0 0;
    display: flex; align-items: center; gap: 9px;
    padding: 0 12px;
    font-size: 12px; color: #4d535a;
    box-shadow: 0 -1px 0 rgba(0,0,0,.03);
  }
  .tab .fav{ width:15px;height:15px;border-radius:4px;background:#2f4562;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex:none; }
  .tab .txt{ overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1; }
  .tab .x{ color:#9a9e9a; font-size:14px; }
  .newtab{ color:#8b8f8a; font-size:18px; align-self:center; margin-left:4px; }
  /* ---- address bar ---- */
  .addressbar{
    height: 46px; flex: none;
    background: #fffdf8;
    border-bottom: 1px solid #e6e0d1;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
  }
  .nav-btns{ display:flex; gap:16px; color:#8b8f8a; font-size:17px; font-weight:600; }
  .addr{
    flex: 1; height: 30px;
    background: #f3f0e7;
    border: 1px solid #eae4d5;
    border-radius: 16px;
    display: flex; align-items: center; gap: 9px;
    padding: 0 14px;
    font-size: 12.5px; color: #6f746f;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .addr .lock{ font-size:11px; color:#788c5d; }
  .addr .exticon{ margin-left:auto; width:18px;height:18px;border-radius:5px;background:#23262b;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px; }
  /* ---- viewport ---- */
  .viewport{ flex: 1; display: flex; min-height: 0; background: #fff; }
  .webpage{
    flex: 1; min-width: 0; padding: 40px 46px;
    background: #fbfaf6;
    overflow: hidden; position: relative;
  }
  .wp-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:54px; }
  .wp-brand{ font-family: Georgia,"Songti SC",serif; font-size:20px; color:#33383f; letter-spacing:.5px; }
  .wp-nav{ display:flex; gap:28px; color:#9a9e9a; font-size:12px; }
  .wp-kicker{ font-size:11px; letter-spacing:2.5px; color:#a8a49a; text-transform:uppercase; margin-bottom:18px; }
  .wp-title{ font-family: Georgia,"Songti SC",serif; font-size:50px; line-height:1.12; color:#2b3037; margin:0 0 20px; font-weight:400; }
  .wp-sub{ font-size:14px; color:#8b8f8a; max-width:420px; line-height:1.7; }
  .wp-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; margin-top:48px; }
  .wp-card{ background:#f1eee6; border-radius:8px; overflow:hidden; }
  .wp-thumb{ height:118px; }
  .wp-card:nth-child(1) .wp-thumb{ background:linear-gradient(135deg,#d9d2c2,#c8bfa8); }
  .wp-card:nth-child(2) .wp-thumb{ background:linear-gradient(135deg,#cfd6d2,#b9c4bd); }
  .wp-card:nth-child(3) .wp-thumb{ background:linear-gradient(135deg,#d6d0d8,#c1b9c7); }
  .wp-meta{ padding:12px 14px; }
  .wp-line{ height:8px; border-radius:4px; background:#ded9cd; margin-bottom:8px; }
  .wp-line.s{ width:60%; }
  /* ---- side panel (real UI) ---- */
  .panel{ width: 400px; flex: none; border-left: 1px solid #ded8c8; box-shadow: -6px 0 20px rgba(58,49,33,.06); }
  .panel iframe{ width: 100%; height: 100%; border: 0; display: block; }
  .caption{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    font-family: Georgia,"Songti SC",serif; font-size:13px; color:#8a8270; letter-spacing:1px;
    z-index:2;
  }
</style>
</head>
<body>
  <div class="browser">
    <div class="tabstrip">
      <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
      <div class="tab"><span class="fav">W</span><span class="txt">Awwwards — 每日最佳网页设计</span><span class="x">×</span></div>
      <span class="newtab">+</span>
    </div>
    <div class="addressbar">
      <div class="nav-btns"><span>‹</span><span>›</span><span>⟳</span></div>
      <div class="addr"><span class="lock">🔒</span><span>www.awwwards.com</span><span class="exticon">M</span></div>
    </div>
    <div class="viewport">
      <div class="webpage">
        <div class="wp-top"><span class="wp-brand">The Archive</span><span class="wp-nav"><span>Discover</span><span>Collections</span><span>Journal</span><span>About</span></span></div>
        <div class="wp-kicker">Curated · Vol. 42</div>
        <h1 class="wp-title">Design that<br/>deserves a<br/>second look.</h1>
        <p class="wp-sub">A quiet archive of considered interfaces, typography and the small details that make the web feel alive.</p>
        <div class="wp-grid">
          <div class="wp-card"><div class="wp-thumb"></div><div class="wp-meta"><div class="wp-line"></div><div class="wp-line s"></div></div></div>
          <div class="wp-card"><div class="wp-thumb"></div><div class="wp-meta"><div class="wp-line"></div><div class="wp-line s"></div></div></div>
          <div class="wp-card"><div class="wp-thumb"></div><div class="wp-meta"><div class="wp-line"></div><div class="wp-line s"></div></div></div>
        </div>
      </div>
      <div class="panel"><iframe id="pane" src="../dev-preview/preview.html"></iframe></div>
    </div>
  </div>
  <div class="caption">Marknest · 书签管家</div>
  <script>
    var pane = new URLSearchParams(location.search).get('pane');
    var map = { list:'', tabs:'?view=tabs', newgroup:'?newgroup=1', savemenu:'?savemenu=1' };
    document.getElementById('pane').src = '../dev-preview/preview.html' + (map[pane] || '');
  </script>
</body>
</html>
